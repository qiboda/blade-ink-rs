[package]
name = "bladeink"
version = "2.1.0"
authors = ["Rafael Garcia <bladecoder@gmail.com>"]
description = """
This is a Rust port of inkle's ink, a scripting language for writing interactive narrative.
"""
license = "Apache-2.0"
repository = "https://github.com/bladecoder/blade-ink-rs/"
keywords = ["ink", "gamedev", "narrative"]
categories = ["game-development"]
readme = "../README.md"
edition = "2024"

[lib]
name = "bladeink"
path = "src/lib.rs"

[[example]]
name = "image_story_cost"
required-features = ["std", "binary-image"]

[dependencies]
serde_json = { version = "1.0.151", optional = true }
strum = { version = "0.28", default-features = false, features = ["derive"] }
as-any = "0.3.0"
rand = { version = "0.10.2", default-features = false, features = ["std_rng"] }
web-time = { version = "1.1.0", optional = true }
hashbrown = "0.16"
libm = "0.2"
core3 = { version = "0.1", default-features = false, features = ["alloc"] }

[features]
default = ["std", "serde-json-parser"]
std = ["dep:web-time", "dep:getrandom", "core3/std", "rand/thread_rng"]
serde-json-parser = ["dep:serde_json"]
stream-json-parser = []
load-profile = ["std"]
binary-image = []

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
